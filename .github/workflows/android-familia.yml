name: Android familiar — APK offline

on:
  push:
    branches: [mobile/family-visitors-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código sem modelos protegidos
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar e testar o Jardim
        run: |
          npm ci
          npm test
      - name: Empacotador Android Capacitor 8
        run: |
          npm install --no-save --no-package-lock @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8
          npx cap add android
          npx cap sync android
      - name: Gerar APK instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Entregar APK familiar
        uses: actions/upload-artifact@v4
        with:
          name: jardim-da-sofia-android-familiar
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
