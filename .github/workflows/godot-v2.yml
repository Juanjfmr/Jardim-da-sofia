name: Godot V2 - primeiro jardim 3D

on:
  pull_request:
    paths:
      - "next-gen/**"
      - ".github/workflows/godot-v2.yml"
  push:
    branches: [feat/godot-pipo-3d-foundation]
    paths:
      - "next-gen/**"
      - ".github/workflows/godot-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Buscar modelos CC0 em suas fontes originais
        run: bash next-gen/tools/fetch_assets.sh
      - name: Instalar Godot 4.5.1
        run: |
          curl --retry 3 -fLsS \
            "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.5.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Importar GLB e validar a cena no Godot
        run: |
          godot --headless --editor --path next-gen --import --quit
          godot --headless --path next-gen --script res://tests/smoke.gd
      - name: Montar projeto para teste
        run: |
          cd next-gen
          zip -rq ../jardim-sofia-godot-v2.zip project.godot scenes scripts tests assets ASSETS.md README.md
      - uses: actions/upload-artifact@v4
        with:
          name: jardim-sofia-godot-primeiro-3d
          path: jardim-sofia-godot-v2.zip
          retention-days: 14
          if-no-files-found: error
